name: Tadreeby Gemini Frontend Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the frontend task Gemini should implement"
        required: true
        type: string
      base_branch:
        description: "Branch to use as the base for the AI change"
        required: true
        default: "ux/trainer-experience-v2"
        type: string
      model:
        description: "Gemini model"
        required: true
        default: "gemini-3.6-flash"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tadreeby-gemini-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade google-genai

      - name: Check Tadreeby agent documents
        shell: bash
        run: |
          if [ -f skills-lock.json ]; then
            echo "skills-lock.json found."
          else
            echo "WARNING: skills-lock.json is not present in this checkout."
          fi

          if [ -f scope.md ]; then
            echo "scope.md found."
          else
            echo "WARNING: scope.md is not present in this checkout."
          fi

          if [ -f SKILL.md ] || [ -f skill.md ]; then
            echo "Tadreeby SKILL.md found."
          else
            echo "WARNING: Tadreeby SKILL.md is not present in this checkout."
          fi

      - name: Restore locked external skills
        if: hashFiles('skills-lock.json') != ''
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          npx -y skills@latest experimental_install

      - name: Run Gemini implementation agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TASK: ${{ inputs.task }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          python scripts/gemini_agent.py

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          git add -N -- . ':!gemini_response.txt' 2>/dev/null || true

          if git status --porcelain -- . ':!gemini_response.txt' | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Gemini produced repository changes."
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Gemini produced no changes."
          fi

      - name: Install frontend dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Check whitespace/errors
        if: steps.changes.outputs.changed == 'true'
        run: git diff --check

      - name: Lint frontend
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Build frontend
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Create AI branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SLUG=$(printf '%s' "$TASK" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | sed -E 's/^-+|-+$//g' \
            | cut -c1-50)

          if [ -z "$SLUG" ]; then
            SLUG="frontend-task"
          fi

          BRANCH="ai/gemini-${SLUG}-${RUN_ID}"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Commit AI changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(ai): implement Tadreeby frontend task"

      - name: Push AI branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: git push --set-upstream origin "$BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          HEAD_BRANCH: ${{ steps.branch.outputs.branch }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          TITLE=$(printf '%s' "$TASK" | tr '\n' ' ' | cut -c1-70)

          cat > pr_body.md <<EOF
          ## Gemini implementation

          **Task:**
          $TASK

          ### What was done
          - Gemini read the Tadreeby project instructions available in the checkout.
          - Gemini restored the external skills listed in skills-lock.json when available.
          - Gemini inspected task-relevant repository files.
          - ESLint passed.
          - Vite production build passed.

          ### Review checklist
          - [ ] Verify the UI visually.
          - [ ] Verify responsive behavior.
          - [ ] Verify accessibility and keyboard behavior.
          - [ ] Review the complete diff for unrelated changes.
          - [ ] Confirm the implementation matches the Tadreeby design system.

          This PR was created by the Tadreeby Gemini workflow and is intentionally left for human review.
          EOF

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "feat(ai): $TITLE" \
            --body-file pr_body.md
